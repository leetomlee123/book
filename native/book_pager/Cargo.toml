[package]
name = "book_pager"
version = "0.1.0"
edition = "2021"
description = "Novel reader text pagination (TextComposition port) for Flutter"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "book_pager"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmic-text = "0.12"
fontdb = "0.16"
once_cell = "1"
parking_lot = "0.12"

