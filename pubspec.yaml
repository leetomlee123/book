name: book
description: A Flutter novel reader application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  fluro: ^2.0.5
  bot_toast: ^4.1.3
  event_bus: ^2.0.1
  get_it: ^8.0.3
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0+1
  battery_plus: ^7.1.0
  package_info_plus: ^10.2.0
  flutter_cache_manager: ^3.4.1
  extended_image: ^10.0.0
  pull_to_refresh: ^2.0.0
  flex_color_scheme: ^8.2.0
  html: ^0.15.6
  protobuf: ^4.0.0
  json_annotation: ^4.9.0
  convert: ^3.1.2
  url_launcher: ^6.3.1
  readmore: ^3.0.0
  intl: ^0.20.2
  ffi: ^2.1.4
  path: ^1.9.1
  # Book-source engine: charset + JS rules (Legado subset)
  fast_gbk: ^1.0.0
  flutter_js: ^0.8.5
  # Force modern Android embedding (namespace) for AGP 8+/9
  flutter_plugin_android_lifecycle: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

# Transitive pins that break Dart 3.12 / AGP 9 builds
dependency_overrides:
  platform: ^3.1.6

flutter:
  uses-material-design: true
  assets:
    - images/
